version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    volumes:
      - vendor_data:/var/www/html/vendor
      - .:/var/www/html
    networks:
      - laravel_network

  webserver:
    image: nginx:latest
    container_name: laravel_webserver
    restart: unless-stopped
    ports:
      - "8081:8443" # Map host port 8081 to container port 8443
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/ssl/mycerts/docker.dodokiinvestmenttz.co.tz.key:/etc/ssl/mycerts/docker.dodokiinvestmenttz.co.tz.key
      - /etc/ssl/mycerts/docker.dodokiinvestmenttz.co.tz.crt:/etc/ssl/mycerts/docker.dodokiinvestmenttz.co.tz.crt
    networks:
      - laravel_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: laravel
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel_network


  redis:
    image: redis:alpine
    container_name: laravel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - laravel_network

  # To run QUEUE as a service FOR high scalability UNCOMMENT & remove php artisan queue:work from supervisord.conf
  # queue:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: laravel_queue
  #   restart: unless-stopped
  #   command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3"]
  #   volumes:
  #     - .:/var/www/html
  #   depends_on:
  #     - redis
  #   networks:
  #     - laravel_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laravel_phpmyadmin
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: secret
    depends_on:
      - db
    networks:
      - laravel_network

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local
  vendor_data:

networks:
  laravel_network:
